name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  desktop:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 引擎自检
        run: pnpm test

      # tauri-action 会读 tauri.conf.json 里的 beforeBuildCommand 来构建前端，
      # 然后编译并把 exe / NSIS 安装程序传到 release。
      - name: 构建桌面应用并发布
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '方格纸预览 ${{ github.ref_name }}'
          releaseBody: |
            把 Word（`.docx`）或粘贴的中文正文，按 **20 × 20 = 400 格/页** 的方格纸排版并预览。

            ## 下载

            | 文件 | 说明 |
            | --- | --- |
            | `*_x64-setup.exe` | 安装程序，装到开始菜单，带卸载项 |
            | `*_portable.exe` | 免安装版，双击即用 |

            用的是 Windows 自带的 WebView2，不需要额外安装运行时。文稿不上传，
            解析和排版全部在本地完成。

            ## 首次启动报 `os error 5`？

            那是运行环境的权限问题：WebView2 需要在 `%LOCALAPPDATA%` 下建数据目录并设置 ACL，
            被安全软件或受限环境挡住时会这样。把环境变量 `WEBVIEW2_USER_DATA_FOLDER`
            指向一个可写目录即可。

            其他用法（网页版、单文件 HTML）和已知边界见
            [README](https://github.com/${{ github.repository }}#readme)。
          releaseDraft: false
          prerelease: false

      # tauri build 会先在 target/release 下产出裸 exe，再拿它去打 NSIS 包。
      # 裸 exe 就是免安装版，顺手一起传上去。
      # 注意：gh release upload 的 file#label 只改"显示标签"不改文件名，
      # 所以这里先复制成带版本号的文件名再传，保证下载下来的名字自解释。
      - name: 附上免安装版
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = Get-ChildItem "src-tauri/target/release/*.exe" -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -notmatch 'setup' } |
                 Select-Object -First 1
          if (-not $exe) { throw "在 src-tauri/target/release 下没找到 exe" }
          $dest = Join-Path $exe.DirectoryName "gaozhi-preview_${tag}_x64_portable.exe"
          Copy-Item $exe.FullName $dest -Force
          Write-Output "上传免安装版：$(Split-Path $dest -Leaf)（$([math]::Round((Get-Item $dest).Length / 1MB, 2)) MB）"
          gh release upload $tag $dest --clobber
