name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  desktop:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 引擎自检
        run: pnpm test

      # tauri-action 会读 tauri.conf.json 里的 beforeBuildCommand 来构建前端，
      # 然后编译并把 exe / NSIS 安装程序传到 release。
      - name: 构建桌面应用并发布
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '方格纸预览 ${{ github.ref_name }}'
          releaseBody: |
            把 Word（`.docx`）或粘贴的中文正文，按 **20 × 20 = 400 格/页** 的方格纸排版并预览。

            ## 下载

            | 文件 | 说明 |
            | --- | --- |
            | `*_x64-setup.exe` | 安装程序，装到开始菜单，带卸载项 |
            | `*_x64_en-US.msi` | MSI 安装包（如果本次构建包含） |
            | `gaozhi-preview.exe` | 免安装版，双击即用（如果本次构建包含） |

            用的是 Windows 自带的 WebView2，不需要额外安装运行时。文稿不上传，
            解析和排版全部在本地完成。

            ## 首次启动报 `os error 5`？

            那是运行环境的权限问题：WebView2 需要在 `%LOCALAPPDATA%` 下建数据目录并设置 ACL，
            被安全软件或受限环境挡住时会这样。把环境变量 `WEBVIEW2_USER_DATA_FOLDER`
            指向一个可写目录即可。

            详见 [README](https://github.com/${{ github.repository }}#readme)。
          releaseDraft: false
          prerelease: false
